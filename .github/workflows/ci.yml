# The same pipeline as azure-pipelines.yml, run on GitHub so every push gets checked
name: CI
on: [push, pull_request]

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test CoreShift.slnx
      - name: Migration rehearsal
        run: ci/rehearsal.sh
