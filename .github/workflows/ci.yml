# The same pipeline as azure-pipelines.yml, run on GitHub so every push gets checked
name: CI
on: [push, pull_request]
# The job only reads the code, so its token can't write to the repo
permissions:
  contents: read

jobs:
  rehearsal:
    # Pinned like SQL Server: ubuntu-latest moves to Ubuntu 26 under you; bump it deliberately
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test CoreShift.slnx
      - name: Migration rehearsal
        run: ci/rehearsal.sh
