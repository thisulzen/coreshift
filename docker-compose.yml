# SQL Server for CoreShift. db/load-legacy.sh starts it; on its own: docker compose up -d
name: coreshift

services:
  sql:
    # Pinned, so CI and every laptop run the build the rehearsals were proven on; bump it deliberately
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer                  # free, full-featured, licensed for dev/test only
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports:
      - "127.0.0.1:1433:1433"               # reachable from this Mac only, not the network
    volumes:
      - sqldata:/var/opt/mssql              # database files survive container restarts
      # The project root, read-only, for the SQL scripts and the extract. Mounting the root rather than
      # the output folder means deleting and regenerating the extract doesn't leave a stale mount.
      - .:/coreshift:ro
    healthcheck:
      # Healthy once the CoreShift database (if it exists yet) can actually be read. SQL Server takes
      # logins, and even lists the database as ONLINE, before it has finished starting it up, so
      # anything less let loads start too early after a restart.
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -o /dev/null -Q "IF DB_ID('CoreShift') IS NOT NULL EXEC('SELECT TOP 1 1 FROM CoreShift.sys.objects')"
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

volumes:
  sqldata:
